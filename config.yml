project:
  name: "Compound-Sustainability-Stress-Modeling"
  version: "1.0"
  description: "Spatio-temporal compound sustainability stress modeling for 4 Indian cities (Mumbai, Delhi, Bengaluru, Bikaner)"

time:
  start_month: "2020-01"
  end_month: "2022-12"
  aggregation: "monthly"

spatial:
  h3_resolution: 8                # ~0.74 km² per hex
  bbox_buffer_km: 10              # Buffer around city bounding box

cities:
  - mumbai
  - delhi
  - bengaluru
  - bikaner

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  features_data: "data/features"
  h3_panel: "data/h3_panel"
  metadata: "data/metadata"
  logs: "logs"

datasets:
  era5: true
  sentinel2_ndvi: true
  modis_lst: true
  ghsl_built_up: true
  pm25: true
  osm: true
  vulnerability: true

era5:
  variables:
    - "2m_temperature"
    - "2m_dewpoint_temperature"
    - "total_precipitation"
    - "10m_u_component_of_wind"
    - "10m_v_component_of_wind"
    - "surface_solar_radiation_downwards"
    - "volumetric_soil_water_layer_1"
    - "volumetric_soil_water_layer_2"
  grid_resolution: 0.1            # Degrees, ~11 km
  product_type: "reanalysis"
  dataset: "reanalysis-era5-single-levels"

satellite:
  ndvi_collection: "sentinel-2-l2a"
  lst_collection: "modis-11A2-061"   # MODIS MOD11A2 LST (1 km)
  cloud_cover_threshold: 20          # Percent max cloud cover
  ndvi_bands:
    red: "B04"
    nir: "B08"

pm25:
  # NASA SEDAC Annual mean
  sedac_url: "https://sedac.ciesin.columbia.edu/downloads/data/sdei/sdei-global-annual-avg-pm2-5-modvrs-2001-2022/sdei-global-annual-avg-pm2-5-modvrs-2001-2022-tif.zip"
  unit: "ug_m3"
  who_guideline_ug_m3: 15.0         # WHO 2021 annual guideline threshold

osm:
  network_type: "drive"           # For road density
  timeout: 300
  cache_folder: "data/raw/osm_cache"

ssi:
  # Compound interaction parameters (Zscheischler et al. 2018)
  gamma: 0.5                      # Interaction scaling factor
  kappa: 1.0                      # City-rank adjustment sensitivity factor

  # City-specific weight multipliers
  city_weights:
    delhi:
      pollution_exposure: 1.3
      heat_stress: 1.2
      water_stress: 0.8
      urban_vulnerability: 1.1
      vegetation_degradation: 0.9
    mumbai:
      heat_stress: 1.2
      water_stress: 1.3
      pollution_exposure: 1.0
      urban_vulnerability: 1.2
      vegetation_degradation: 0.9
    bengaluru:
      water_stress: 1.4
      heat_stress: 1.1
      urban_vulnerability: 1.1
      vegetation_degradation: 1.1
      pollution_exposure: 0.9
    bikaner:
      heat_stress: 1.5
      water_stress: 1.4
      vegetation_degradation: 1.3
      urban_vulnerability: 1.0
      pollution_exposure: 0.8

  ssi_bands:
    Low: [0.0, 0.25]
    Moderate: [0.25, 0.5]
    High: [0.5, 0.75]
    Extreme: [0.75, 1.0]

  archetype_k: 6                  # k-means clusters for stress archetypes
  anomaly_threshold_pct: 90       # Percentile above which anomaly_flag=True

normalization:
  method: "zscore"                # Options: zscore, minmax
  clip_floor: 0.0                 # Clamp negatives to 0 (0 = normal, >0 = stress)
  baseline_window_years: 3        # 3-year baseline (2020-2022)

logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name} | {message}"